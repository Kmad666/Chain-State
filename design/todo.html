<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chain State Master To-Do</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+Double+Pica&family=Alegreya+Sans:wght@400;500;700&family=Courier+Prime&display=swap">
<style>
:root { --sky: #e4edf4; --card: #fbfdff; --ink: #1d2433; --soft: #55607a; --line: #9fb0c4; --brass: #a8741a; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --sky: #141a2c; --card: #212a45; --ink: #e8ecf6; --soft: #a5afc8; --line: #4d5a7c; --brass: #e2b25a; color-scheme: dark; }
}
:root[data-theme="dark"] { --sky: #141a2c; --card: #212a45; --ink: #e8ecf6; --soft: #a5afc8; --line: #4d5a7c; --brass: #e2b25a; color-scheme: dark; }
body { margin: 0; background: var(--sky); color: var(--ink); font: 16px/1.55 "Alegreya Sans", system-ui, sans-serif; }
main { max-width: 820px; margin: 0 auto; padding: 28px 16px 56px; }
.back { font-family: "Courier Prime", monospace; font-size: 13px; color: var(--brass); }
h1 { font-family: "IM Fell Double Pica", Georgia, serif; font-weight: 400; font-size: clamp(32px, 6vw, 46px); margin: 10px 0 4px; }
h2 { font-family: "IM Fell Double Pica", Georgia, serif; font-weight: 400; font-size: 27px; margin: 30px 0 6px; padding-top: 12px; border-top: 1px solid var(--line); }
p { color: var(--soft); }
ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 6px; }
li { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; }
li input { margin-right: 8px; accent-color: var(--brass); }
code { font-family: "Courier Prime", monospace; }
a { color: var(--brass); }
</style>
</head>
<body>
<main>
  <a class="back" href="./">← Design files</a>
  <div id="doc"><p>Loading the to-do list…</p></div>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script>
fetch("master-todo.md").then(r => r.text()).then(md => {
  document.getElementById("doc").innerHTML = marked.parse(md);
}).catch(() => {
  document.getElementById("doc").innerHTML = '<p>Couldn\'t load the list here. Open <a href="master-todo.md">master-todo.md</a> instead.</p>';
});
</script>
</body>
</html>
