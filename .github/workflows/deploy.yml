name: Build & deploy to GitHub Pages

# Every push to main:
#  - exports for the web and publishes to the gh-pages branch (GitHub Pages), for quick testing
#  - exports a Windows desktop build, downloadable from the run's Artifacts

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.1

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot + web templates
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-web-win

      - name: Install Godot
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          cd ~/godot
          wget -q https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          unzip -q Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          rm Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          wget -q https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          unzip -qj Godot_v${GODOT_VERSION}-stable_export_templates.tpz 'templates/web_*' 'templates/windows_*_x86_64.exe' 'templates/version.txt' \
            -d ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/
          rm Godot_v${GODOT_VERSION}-stable_export_templates.tpz

      - name: Export for web
        run: |
          GODOT=~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64
          mkdir -p build/web
          $GODOT --headless --import || true
          $GODOT --headless --export-release "Web" build/web/index.html
          touch build/web/.nojekyll
          ls -la build/web
          grep -q "test test test" build/web/index.pck && echo "dialogue files are in the build" || (echo "dialogue/*.json missing from the build" && exit 1)
          grep -q "Scorching with no fuel" build/web/index.pck && echo "field guide is in the build" || (echo "data/*.json missing from the build" && exit 1)

      - name: Smoke tests
        run: |
          ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 --headless res://tests/test_runner.tscn
          git checkout -- dialogue/   # tests may touch the shipped dialogue file

      - name: Export for Windows
        continue-on-error: true
        run: |
          mkdir -p build/windows
          ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 --headless --export-release "Windows Desktop" build/windows/ChainState.exe
          ls -la build/windows

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: ChainState-windows
          path: build/windows/
          if-no-files-found: warn

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: build/web
          force_orphan: true
